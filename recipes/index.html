<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Book</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media',
        }
    </script>
</head>

<body
    class="h-full bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 antialiased flex flex-col text-sm sm:text-base">

    <div id="app" class="h-full flex flex-col flex-1 items-center"></div>

    <script>
        const VERSION = "1.0.2";

        // Application State
        let state = {
            recipes: [],
            loaded: false,
            error: null,
            selectedRecipeIndex: null,
            searchQuery: "",
            searchMode: "all" // 'all' or 'exact'
        };

        async function loadRecipes() {
            try {
                const response = await fetch('recipes.json');
                if (!response.ok) {
                    throw new Error(`Failed to load recipes.json (Status: ${response.status})`);
                }
                const data = await response.json();
                if (!Array.isArray(data)) {
                    throw new Error("Invalid format: recipes.json must contain an array of recipes.");
                }
                state.recipes = data;
                state.loaded = true;
            } catch (err) {
                state.error = err.message;
                state.loaded = true;
            }
            render();
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const data = JSON.parse(event.target.result);
                    if (!Array.isArray(data)) {
                        throw new Error("Invalid format: JSON file must contain an array.");
                    }
                    state.recipes = data;
                    state.error = null;
                    state.loaded = true;
                    render();
                } catch (err) {
                    alert("Error parsing JSON: " + err.message);
                }
            };
            reader.readAsText(file);
        }

        function parseSearchQuery(query) {
            const regex = /"([^"]+)"|([^\s"]+)/g;
            const terms = [];
            let match;
            while ((match = regex.exec(query)) !== null) {
                terms.push((match[1] || match[2]).toLowerCase());
            }
            return terms;
        }

        function getFilteredRecipes() {
            const query = state.searchQuery.trim();
            if (!query) return state.recipes.map((recipe, index) => ({ recipe, index }));

            if (state.searchMode === 'exact') {
                const queryLower = query.toLowerCase();
                return state.recipes.map((recipe, index) => ({ recipe, index })).filter(({ recipe }) => {
                    const inTitle = recipe.title.toLowerCase().includes(queryLower);
                    const inMeta = recipe.metadata && Object.entries(recipe.metadata).some(([k, v]) =>
                        k.toLowerCase().includes(queryLower) || v.toLowerCase().includes(queryLower)
                    );
                    const inIngredients = recipe.ingredients && recipe.ingredients.some(row =>
                        row.some(cell => cell && cell.toLowerCase().includes(queryLower))
                    );
                    return inTitle || inMeta || inIngredients;
                });
            } else {
                const terms = parseSearchQuery(query);
                if (terms.length === 0) return state.recipes.map((recipe, index) => ({ recipe, index }));

                return state.recipes.map((recipe, index) => ({ recipe, index })).filter(({ recipe }) => {
                    const titleText = recipe.title.toLowerCase();
                    const metaText = recipe.metadata ? Object.entries(recipe.metadata).map(([k, v]) => `${k} ${v}`).join(" ").toLowerCase() : "";
                    const ingredientText = recipe.ingredients ? recipe.ingredients.flat().filter(Boolean).join(" ").toLowerCase() : "";
                    const fullText = `${titleText} ${metaText} ${ingredientText}`;

                    return terms.every(term => fullText.includes(term));
                });
            }
        }

        function render() {
            const app = document.getElementById('app');

            if (!state.loaded) {
                app.innerHTML = `
                    <div class="w-full max-w-2xl flex flex-col flex-1 bg-white dark:bg-gray-900 shadow-sm border-x border-gray-200 dark:border-gray-800 items-center justify-center p-6 text-center">
                        <div class="space-y-1.5">
                            <h2 class="text-base sm:text-lg font-bold">Loading recipes...</h2>
                            <p class="text-xs sm:text-sm text-gray-500">Attempting to load recipes.json</p>
                        </div>
                    </div>
                `;
                return;
            }

            let contentHTML = '';

            if (state.error) {
                contentHTML = `
                    <div class="flex flex-col flex-1 p-5 items-center justify-center text-center space-y-3">
                        <div class="p-3.5 rounded-xl bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-900 text-amber-800 dark:text-amber-200 text-xs sm:text-sm max-w-md">
                            <p class="font-semibold mb-1">Could not load <code class="bg-amber-100 dark:bg-amber-900 px-1 rounded">recipes.json</code> automatically.</p>
                            <p class="opacity-80 mb-2">${escapeHTML(state.error)}</p>
                            <p>If you are opening this file directly from your computer, browsers block automatic file loading due to security restrictions. Please select your <code class="bg-amber-100 dark:bg-amber-900 px-1 rounded">recipes.json</code> file below:</p>
                        </div>
                        <label class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white font-medium text-xs sm:text-sm px-3.5 py-2 rounded-xl shadow-xs transition-colors">
                            <span>Browse recipes.json</span>
                            <input type="file" id="file-input" accept=".json" class="hidden" />
                        </label>
                    </div>
                `;
            } else if (state.selectedRecipeIndex !== null) {
                const r = state.recipes[state.selectedRecipeIndex];
                contentHTML = `
                    <div class="p-3.5 sm:p-5 space-y-3.5">
                        <div class="flex items-center gap-2 border-b border-gray-200 dark:border-gray-800 pb-2.5">
                            <button id="back-btn" class="inline-flex items-center text-xs font-semibold bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 px-2 py-1 rounded-md transition-colors shrink-0">
                                ← Back
                            </button>
                            <h2 class="text-sm sm:text-base font-bold truncate leading-tight">${escapeHTML(r.title)}</h2>
                        </div>
                        
                        ${r.metadata && Object.keys(r.metadata).length > 0 ? `
                            <div class="flex flex-wrap gap-1.5">
                                ${Object.entries(r.metadata).map(([k, v]) => `
                                    <div class="text-[11px] sm:text-xs bg-gray-100 dark:bg-gray-800 px-2 py-0.5 rounded-md">
                                        <span class="font-semibold text-gray-600 dark:text-gray-400 capitalize">${escapeHTML(k)}:</span> ${escapeHTML(v)}
                                    </div>
                                `).join('')}
                            </div>
                        ` : ''}

                        <div class="space-y-1.5">
                            <h3 class="text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400">Ingredients</h3>
                            <ul class="list-disc list-inside space-y-1 text-xs sm:text-sm text-gray-700 dark:text-gray-300">
                                ${r.ingredients ? r.ingredients.map(row => `
                                    <li>
                                        <span class="font-medium">${escapeHTML(row[0] || '')}</span> 
                                        ${escapeHTML(row[1] || '')} 
                                        ${escapeHTML(row[2] || '')} 
                                        ${row[3] ? `(${escapeHTML(row[3])})` : ''}
                                        ${row.slice(4).length > 0 ? escapeHTML(' ' + row.slice(4).join(' ')) : ''}
                                    </li>
                                `).join('') : ''}
                            </ul>
                        </div>

                        <div class="space-y-1.5 pt-1">
                            <h3 class="text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400">Instructions</h3>
                            <ol class="list-decimal list-inside space-y-1.5 text-xs sm:text-sm text-gray-700 dark:text-gray-300">
                                ${r.instructions ? r.instructions.map(step => `
                                    <li class="pl-0.5 leading-relaxed">
                                        <span class="text-gray-900 dark:text-gray-100">${escapeHTML(step)}</span>
                                    </li>
                                `).join('') : ''}
                            </ol>
                        </div>
                    </div>
                `;
            } else {
                const filtered = getFilteredRecipes();
                contentHTML = `
                    <div class="flex flex-col flex-1 p-3.5 space-y-3 w-full">
                        <div class="space-y-1.5">
                            <div class="relative flex items-center">
                                <input
                                    id="search-input"
                                    type="text"
                                    value="${escapeHTML(state.searchQuery)}"
                                    placeholder="Search recipes, ingredients, metadata..."
                                    class="w-full bg-gray-100 dark:bg-gray-800 border border-transparent focus:border-blue-500 dark:focus:border-blue-400 rounded-xl px-3.5 py-2 pr-9 text-xs sm:text-sm focus:outline-none transition-colors"
                                />
                                ${state.searchQuery ? `
                                    <button
                                        id="clear-search-btn"
                                        class="absolute right-2.5 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 text-xs font-bold px-1 py-0.5 rounded-full"
                                        title="Clear search"
                                    >
                                        ✕
                                    </button>
                                ` : ''}
                            </div>

                            <div class="flex items-center justify-between text-[11px] sm:text-xs text-gray-500 dark:text-gray-400 px-0.5">
                                <span>Search mode:</span>
                                <div class="inline-flex rounded-lg bg-gray-100 dark:bg-gray-800 p-0.5">
                                    <button
                                        data-mode="all"
                                        class="mode-btn px-2.5 py-0.5 rounded-md font-medium transition-all ${state.searchMode === 'all' ? 'bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 shadow-xs' : 'hover:text-gray-900 dark:hover:text-gray-100'}"
                                    >
                                        All Words
                                    </button>
                                    <button
                                        data-mode="exact"
                                        class="mode-btn px-2.5 py-0.5 rounded-md font-medium transition-all ${state.searchMode === 'exact' ? 'bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 shadow-xs' : 'hover:text-gray-900 dark:hover:text-gray-100'}"
                                    >
                                        Exact Match
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="flex-1 space-y-2">
                            ${filtered.length === 0 ? `
                                <div class="text-center py-10 text-gray-400 dark:text-gray-500 text-xs sm:text-sm">
                                    No recipes found matching your query.
                                </div>
                            ` : filtered.map(({ recipe, index }) => `
                                <div
                                    data-recipe-index="${index}"
                                    class="recipe-card p-3 rounded-xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 hover:border-blue-500 dark:hover:border-blue-500 cursor-pointer transition-all shadow-xs"
                                >
                                    <h3 class="font-semibold text-xs sm:text-sm mb-0.5">${escapeHTML(recipe.title)}</h3>
                                    ${recipe.metadata && Object.keys(recipe.metadata).length > 0 ? `
                                        <div class="flex flex-wrap gap-2 text-[11px] sm:text-xs text-gray-500 dark:text-gray-400">
                                            ${Object.entries(recipe.metadata).slice(0, 2).map(([k, v]) => `
                                                <span><strong class="capitalize">${escapeHTML(k)}:</strong> ${escapeHTML(v)}</span>
                                            `).join('')}
                                        </div>
                                    ` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            app.innerHTML = `
                <div class="w-full max-w-2xl flex flex-col flex-1 bg-white dark:bg-gray-900 shadow-sm border-x border-gray-200 dark:border-gray-800">
                    <header class="px-3.5 py-2.5 border-b border-gray-200 dark:border-gray-800 flex justify-between items-center bg-white dark:bg-gray-900 sticky top-0 z-10">
                        <h1 class="text-xs sm:text-sm font-bold tracking-tight">Recipe Book</h1>
                        <span class="text-[10px] sm:text-xs font-mono text-gray-500 dark:text-gray-400 bg-gray-100 dark:bg-gray-800 px-1.5 py-0.5 rounded">
                            v${VERSION}
                        </span>
                    </header>
                    <main class="flex-1 flex flex-col overflow-y-auto">
                        ${contentHTML}
                    </main>
                </div>
            `;

            attachEventListeners();
        }

        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g,
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        function attachEventListeners() {
            const fileInput = document.getElementById('file-input');
            if (fileInput) {
                fileInput.addEventListener('change', handleFileSelect);
            }

            const backBtn = document.getElementById('back-btn');
            if (backBtn) {
                backBtn.addEventListener('click', () => {
                    state.selectedRecipeIndex = null;
                    render();
                });
            }

            document.querySelectorAll('.recipe-card').forEach(card => {
                card.addEventListener('click', () => {
                    const index = parseInt(card.getAttribute('data-recipe-index'), 10);
                    state.selectedRecipeIndex = index;
                    render();
                });
            });

            const searchInput = document.getElementById('search-input');
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    state.searchQuery = e.target.value;
                    render();
                    const newInput = document.getElementById('search-input');
                    if (newInput) {
                        newInput.focus();
                        newInput.setSelectionRange(newInput.value.length, newInput.value.length);
                    }
                });

                searchInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        searchInput.blur();
                    }
                });
            }

            const clearBtn = document.getElementById('clear-search-btn');
            if (clearBtn) {
                clearBtn.addEventListener('click', () => {
                    state.searchQuery = '';
                    render();
                });
            }

            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    state.searchMode = btn.getAttribute('data-mode');
                    render();
                });
            });
        }

        loadRecipes();
    </script>
</body>

</html>
