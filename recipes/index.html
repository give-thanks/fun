<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>My Recipe Box</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>

<body class="bg-gray-100 dark:bg-gray-900 min-h-screen p-4 md:p-6 transition-colors duration-200">
    <div class="max-w-2xl mx-auto">
        <!-- Top Toolbar Controls -->
        <div class="mb-4 flex justify-end">
            <button id="theme-btn" onclick="toggleTheme()"
                class="bg-white dark:bg-gray-800 px-4 py-2 rounded-lg shadow text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700 flex items-center gap-2 border border-gray-200 dark:border-gray-700 transition">
                <span id="theme-icon">🌙</span> <span id="theme-text">Dark Mode</span>
            </button>
        </div>

        <!-- Main Card Container -->
        <div
            class="bg-white dark:bg-gray-800 rounded-xl shadow-lg h-[calc(100vh-6rem)] flex flex-col overflow-hidden transition-all">

            <!-- Recipe List View -->
            <div id="list-view" class="flex flex-col h-full p-6">
                <h1 class="text-2xl font-bold mb-4 text-gray-800 dark:text-gray-100">Recipe List</h1>

                <!-- Search Input with Clear Button -->
                <div class="relative mb-3">
                    <input type="text" id="search" placeholder="Search by name, ingredient, or author..."
                        class="w-full p-2.5 pr-10 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" />
                    <button id="clear-search" onclick="clearSearch()"
                        class="absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 hidden text-sm font-bold px-1.5 py-0.5 rounded transition">
                        ✕
                    </button>
                </div>

                <!-- Sleek Segmented Control Toggle -->
                <div class="bg-gray-100 dark:bg-gray-700 p-0.5 rounded-lg flex mb-4 text-xs font-medium">
                    <button id="mode-all" onclick="setSearchMode('all')"
                        class="flex-1 py-1.5 rounded-md transition bg-white dark:bg-gray-600 shadow-sm text-gray-900 dark:text-white">All
                        Words</button>
                    <button id="mode-exact" onclick="setSearchMode('exact')"
                        class="flex-1 py-1.5 rounded-md transition text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white">Exact
                        Match</button>
                </div>

                <ul id="recipe-list" class="overflow-y-auto flex-1 divide-y divide-gray-100 dark:divide-gray-700 pr-1">
                </ul>
            </div>

            <!-- Recipe Detail View -->
            <div id="detail-view" class="hidden flex flex-col h-full p-6 overflow-y-auto">
                <div
                    class="mb-4 pb-4 border-b border-gray-200 dark:border-gray-700 flex items-center sticky top-0 bg-white dark:bg-gray-800 z-10">
                    <button onclick="showList()"
                        class="bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 px-3.5 py-2 rounded-lg text-sm font-medium hover:bg-gray-200 dark:hover:bg-gray-600 transition flex items-center gap-1.5 shadow-sm">
                        ← Back to List
                    </button>
                </div>
                <div id="recipe-display" class="text-gray-600 dark:text-gray-300 pb-6">
                </div>
            </div>

        </div>
    </div>

    <script>
        let recipes = [];
        let searchMode = 'all'; // 'all' or 'exact'

        // Initialize theme based on OS preference or localStorage override
        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            updateThemeButton();
        }

        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
            updateThemeButton();
            setSearchMode(searchMode); // Refresh mode button styling
        }

        function updateThemeButton() {
            const isDark = document.documentElement.classList.contains('dark');
            const themeIcon = document.getElementById('theme-icon');
            const themeText = document.getElementById('theme-text');

            themeIcon.textContent = isDark ? '☀️' : '🌙';
            themeText.textContent = isDark ? 'Light Mode' : 'Dark Mode';
        }

        function showList() {
            document.getElementById('detail-view').classList.add('hidden');
            document.getElementById('list-view').classList.remove('hidden');
        }

        function clearSearch() {
            const searchInput = document.getElementById('search');
            searchInput.value = '';
            document.getElementById('clear-search').classList.add('hidden');
            renderList(recipes);
            searchInput.focus();
        }

        function setSearchMode(mode) {
            searchMode = mode;
            const btnAll = document.getElementById('mode-all');
            const btnExact = document.getElementById('mode-exact');
            const isDark = document.documentElement.classList.contains('dark');

            if (mode === 'all') {
                btnAll.className = `flex-1 py-1.5 rounded-md transition shadow-sm ${isDark ? 'bg-gray-600 text-white' : 'bg-white text-gray-900'}`;
                btnExact.className = 'flex-1 py-1.5 rounded-md transition text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white';
            } else {
                btnExact.className = `flex-1 py-1.5 rounded-md transition shadow-sm ${isDark ? 'bg-gray-600 text-white' : 'bg-white text-gray-900'}`;
                btnAll.className = 'flex-1 py-1.5 rounded-md transition text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white';
            }

            executeSearch();
        }

        async function loadRecipes() {
            try {
                const response = await fetch('recipes.json');
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                recipes = await response.json();
                renderList(recipes);
            } catch (err) {
                document.getElementById('recipe-list').innerHTML = `<li class="p-3 text-red-500 text-sm">Failed to load recipes.json. Are you running a local server (like Live Server)?<br><br>Error: ${err.message}</li>`;
            }
        }

        function renderList(items) {
            const listEl = document.getElementById('recipe-list');
            listEl.innerHTML = '';

            items.forEach(recipe => {
                const li = document.createElement('li');
                li.className = 'py-3 px-3 hover:bg-blue-50 dark:hover:bg-gray-700 cursor-pointer rounded text-sm text-gray-700 dark:text-gray-300 truncate transition-colors';
                li.textContent = recipe.title;
                li.onclick = () => displayRecipe(recipe);
                listEl.appendChild(li);
            });
        }

        function displayRecipe(recipe) {
            const displayEl = document.getElementById('recipe-display');

            // Format metadata, filtering out "Serving Size": "0" (or 0)
            let metadataHtml = '';
            if (recipe.metadata && Object.keys(recipe.metadata).length > 0) {
                const metadataItems = Object.entries(recipe.metadata)
                    .filter(([key, value]) => !(key.toLowerCase() === 'serving size' && String(value).trim() === '0'))
                    .map(([key, value]) => `<span class="bg-gray-100 dark:bg-gray-700 px-2.5 py-1 rounded text-xs font-medium text-gray-600 dark:text-gray-300"><strong>${escapeHtml(key)}:</strong> ${escapeHtml(value)}</span>`)
                    .join('');

                if (metadataItems) {
                    metadataHtml = `<div class="flex flex-wrap gap-2 mb-6">${metadataItems}</div>`;
                }
            }

            // Format ingredients list
            const ingredientsHtml = recipe.ingredients && recipe.ingredients.length > 0
                ? `<ul class="list-disc pl-5 mb-6 space-y-1">` +
                recipe.ingredients.map(ing => `<li>${escapeHtml(ing.filter(Boolean).join(' '))}</li>`).join('') +
                `</ul>`
                : '<p class="italic mb-6">No ingredients listed.</p>';

            // Format instructions list
            const instructionsHtml = recipe.instructions && recipe.instructions.length > 0
                ? `<ol class="list-decimal pl-5 space-y-2">` +
                recipe.instructions.map(ins => `<li>${escapeHtml(ins)}</li>`).join('') +
                `</ol>`
                : '<p class="italic">No instructions listed.</p>';

            displayEl.innerHTML = `
        <h2 class="text-2xl font-bold mb-3 text-gray-800 dark:text-gray-100 border-b dark:border-gray-700 pb-2">${escapeHtml(recipe.title)}</h2>
        ${metadataHtml}
        
        <h3 class="text-lg font-semibold mb-2 text-gray-700 dark:text-gray-200">Ingredients</h3>
        ${ingredientsHtml}
        
        <h3 class="text-lg font-semibold mb-2 text-gray-700 dark:text-gray-200">Instructions</h3>
        ${instructionsHtml}
    `;

            // Switch views
            document.getElementById('list-view').classList.add('hidden');
            document.getElementById('detail-view').classList.remove('hidden');
            document.getElementById('detail-view').scrollTop = 0;
        }

        function escapeHtml(str) {
            return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function executeSearch() {
            const searchInput = document.getElementById('search');
            const queryStr = searchInput.value.toLowerCase().trim();
            const clearBtn = document.getElementById('clear-search');

            if (queryStr.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }

            if (!queryStr) {
                renderList(recipes);
                return;
            }

            const filtered = recipes.filter(r => {
                const titleStr = r.title ? r.title.toLowerCase() : '';
                const metadataStr = r.metadata ? Object.entries(r.metadata).map(([k, v]) => `${k} ${v}`).join(' ').toLowerCase() : '';
                const ingredientsStr = r.ingredients ? r.ingredients.map(ingArray => ingArray.filter(Boolean).join(' ')).join(' ').toLowerCase() : '';
                const fullRecipeBlob = `${titleStr} ${metadataStr} ${ingredientsStr}`;

                if (searchMode === 'exact') {
                    return fullRecipeBlob.includes(queryStr);
                } else {
                    const terms = [];
                    const regex = /"([^"]+)"|([^\s]+)/g;
                    let match;
                    while ((match = regex.exec(queryStr)) !== null) {
                        terms.push(match[1] || match[2]);
                    }

                    if (terms.length === 0) return true;

                    return terms.every(term => {
                        const matchTitle = titleStr.includes(term);
                        const matchMetadata = r.metadata && Object.entries(r.metadata).some(([key, value]) =>
                            key.toLowerCase().includes(term) || String(value).toLowerCase().includes(term)
                        );
                        const matchIngredients = r.ingredients && r.ingredients.some(ingArray => {
                            const fullIngredientString = ingArray.filter(Boolean).join(' ').toLowerCase();
                            return fullIngredientString.includes(term);
                        });

                        return matchTitle || matchMetadata || matchIngredients;
                    });
                }
            });

            renderList(filtered);
        }

        document.getElementById('search').addEventListener('input', executeSearch);

        // Initialize theme on load
        initTheme();
        loadRecipes();
    </script>
</body>

</html>
